services:
  - type: web
    name: sistema-ecommerce-servidor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-ecommerce-db
          property: connectionString
      - key: FLASK_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: sistema-ecommerce-db
    plan: free
